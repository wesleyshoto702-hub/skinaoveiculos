name: Verify public auth endpoints
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/auth-smoke.yml'
      - 'src/lib/skinaoAuth.server.ts'
      - 'src/routes/api.admin-auth.ts'
      - 'src/lib/skinaoInventory.functions.ts'
  workflow_dispatch:

jobs:
  test-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for production to serve authentication endpoint
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 15); do
            response=$(curl -sS -m 12 -o /dev/null -w '%{http_code}' 'https://skinaoveiculos.vercel.app/api/admin-auth')
            if [ "$response" = 200 ]; then exit 0; fi
            sleep 8
          done
          echo 'Auth GET did not become ready'
          exit 1
      - name: Verify anonymous requests cannot enter
        shell: bash
        run: |
          set -euo pipefail
          base='https://skinaoveiculos.vercel.app'
          body_file=$(mktemp)
          code=$(curl -sS -m 20 -o "$body_file" -w '%{http_code}' \
            -X POST "$base/api/admin-auth" \
            -H "Origin: $base" -H 'Content-Type: application/json' \
            --data '{"username":"__smoke_nonexistent__","password":"smoke-password-never-used"}')
          echo "Anonymous POST HTTP status: $code"
          cat "$body_file"
          test "$code" = 401
          grep -q '"reason":"invalid"' "$body_file"
          unauthenticated=$(curl -sS -m 20 "$base/api/admin-auth")
          echo "$unauthenticated"
          echo "$unauthenticated" | grep -q '"unlocked":false'
      - name: Verify database and image storage
        run: |
          curl -fsS -m 20 'https://skinaoveiculos.vercel.app/api/health' | grep -q '"status":"ready"'
